<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>BlackTerminal Job Admin</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#f4f6fb;

    color:#182033;

}

.header{

    background:
        linear-gradient(
            135deg,
            #5148e8,
            #8b5cf6
        );

    color:white;

    padding:22px;

}

.header h1{

    margin:0;

    font-size:23px;

}

.header p{

    margin:5px 0 0;

    opacity:.85;

    font-size:13px;

}

.container{

    max-width:1100px;

    margin:auto;

    padding:18px;

}

.stats{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(150px,1fr)
        );

    gap:12px;

    margin-bottom:18px;

}

.stat{

    background:white;

    border-radius:15px;

    padding:16px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.05);

}

.stat strong{

    display:block;

    font-size:24px;

}

.stat span{

    font-size:12px;

    color:#737b8c;

}

.card{

    background:white;

    border-radius:17px;

    padding:18px;

    margin-bottom:18px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.05);

}

.card h2{

    margin-top:0;

    font-size:18px;

}

.form-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px,1fr)
        );

    gap:12px;

}

label{

    display:block;

    font-size:12px;

    font-weight:bold;

    margin-bottom:5px;

}

input,
select,
textarea{

    width:100%;

    padding:11px;

    border:
        1px solid #dfe3eb;

    border-radius:9px;

    outline:none;

}

textarea{

    min-height:90px;

}

button{

    border:0;

    padding:11px 15px;

    border-radius:9px;

    cursor:pointer;

    font-weight:bold;

}

.primary{

    background:#635bff;

    color:white;

}

.secondary{

    background:#eef0f5;

    color:#333;

}

.danger{

    background:#fee2e2;

    color:#b91c1c;

}

.jobs-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(260px,1fr)
        );

    gap:12px;

}

.job{

    border:
        1px solid #e1e4eb;

    border-radius:13px;

    padding:15px;

}

.job h3{

    margin:0 0 5px;

    font-size:15px;

}

.job p{

    font-size:12px;

    color:#737b8c;

    line-height:18px;

}

.job-actions{

    display:flex;

    gap:7px;

    margin-top:12px;

    flex-wrap:wrap;

}

.application{

    border-top:
        1px solid #e5e7ed;

    padding:15px 0;

}

.application:first-child{

    border-top:0;

}

.application h3{

    margin:0;

}

.application p{

    margin:4px 0;

    font-size:12px;

    color:#626a79;

}

.status{

    display:inline-block;

    padding:5px 8px;

    border-radius:999px;

    font-size:10px;

    font-weight:bold;

    background:#eef0f5;

}

.status.New{

    background:#dbeafe;

    color:#1d4ed8;

}

.status.Shortlisted{

    background:#dcfce7;

    color:#15803d;

}

.status.Rejected{

    background:#fee2e2;

    color:#b91c1c;

}

.status.Selected{

    background:#ede9fe;

    color:#6d28d9;

}

.hidden{

    display:none;

}

@media(max-width:600px){

    .container{

        padding:12px;

    }

    .form-grid{

        grid-template-columns:1fr;

    }

}

</style>

</head>

<body>


<div class="header">

    <h1>
        BlackTerminal Job Admin
    </h1>

    <p>
        Jobs & Student Applications
    </p>

</div>


<div class="container">


<!-- =====================================================
     STATS
===================================================== -->

<div class="stats">

    <div class="stat">

        <strong id="totalJobs">
            0
        </strong>

        <span>
            Active Jobs
        </span>

    </div>


    <div class="stat">

        <strong id="totalApplications">
            0
        </strong>

        <span>
            Applications
        </span>

    </div>


    <div class="stat">

        <strong id="newApplications">
            0
        </strong>

        <span>
            New Applications
        </span>

    </div>

</div>


<!-- =====================================================
     ADD JOB
===================================================== -->

<div class="card">

    <h2>
        Add / Edit Job
    </h2>


    <input
        type="hidden"
        id="editJobId"
    >


    <div class="form-grid">


        <div>

            <label>
                Job Title
            </label>

            <input
                id="jobTitle"
                placeholder="Example: Student Coordinator"
            >

        </div>


        <div>

            <label>
                Salary
            </label>

            <input
                id="jobSalary"
                placeholder="Example: ₹9,000/month"
            >

        </div>


        <div>

            <label>
                Job Type
            </label>

            <select id="jobType">

                <option>
                    Full Time
                </option>

                <option selected>
                    Part Time
                </option>

                <option>
                    Internship
                </option>

                <option>
                    Performance Based
                </option>

            </select>

        </div>


        <div>

            <label>
                Location
            </label>

            <input
                id="jobLocation"
                value="Baripada"
            >

        </div>


        <div>

            <label>
                Icon
            </label>

            <input
                id="jobIcon"
                value="💼"
                placeholder="Emoji"
            >

        </div>


        <div>

            <label>
                Skills Type
            </label>

            <select id="skillsType">

                <option value="design">
                    Social Media / Design
                </option>

                <option value="admin">
                    Admin / Student Coordinator
                </option>

                <option value="reception">
                    Reception
                </option>

                <option value="lab">
                    Computer Lab
                </option>

                <option value="general">
                    General
                </option>

            </select>

        </div>


    </div>


    <div style="margin-top:12px;">

        <label>
            Job Description
        </label>

        <textarea
            id="jobDescription"
            placeholder="Describe responsibilities..."
        ></textarea>

    </div>


    <div style="margin-top:12px;">

        <label>

            <input
                type="checkbox"
                id="jobActive"
                checked
                style="width:auto;"
            >

            Active Job

        </label>

    </div>


    <div style="
        display:flex;
        gap:8px;
        margin-top:15px;
    ">

        <button
            class="primary"
            onclick="saveJob()">

            Save Job

        </button>


        <button
            class="secondary"
            onclick="clearJobForm()">

            Clear

        </button>

    </div>

</div>


<!-- =====================================================
     JOBS
===================================================== -->

<div class="card">

    <h2>
        Manage Jobs
    </h2>

    <div
        class="jobs-grid"
        id="jobsList">

        Loading...

    </div>

</div>


<!-- =====================================================
     APPLICATIONS
===================================================== -->

<div class="card">

    <h2>
        Student Applications
    </h2>

    <div
        id="applicationsList">

        Loading...

    </div>

</div>


</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    setDoc,
    updateDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

import {
    firebaseConfig
} from "./firebase-config.js";


/* =========================================================
   FIREBASE
========================================================= */

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* =========================================================
   LOAD
========================================================= */

async function loadJobs(){

    const container =
        document.getElementById(
            "jobsList"
        );

    try{

        const snapshot =
            await getDocs(
                collection(db,"jobs")
            );


        container.innerHTML = "";


        let activeCount = 0;


        snapshot.forEach(
            item => {

                const job =
                    item.data();


                if(job.active !== false)
                    activeCount++;


                const div =
                    document.createElement("div");


                div.className =
                    "job";


                div.innerHTML = `

                    <h3>
                        ${escapeHTML(
                            job.title
                        )}
                    </h3>

                    <p>
                        ${escapeHTML(
                            job.description || ""
                        )}
                    </p>

                    <p>
                        <strong>
                            ${escapeHTML(
                                job.salary || ""
                            )}
                        </strong>
                        •
                        ${escapeHTML(
                            job.type || ""
                        )}
                    </p>

                    <span class="status">

                        ${
                            job.active === false
                            ? "Inactive"
                            : "Active"
                        }

                    </span>

                    <div class="job-actions">

                        <button
                            class="secondary"
                            data-edit="${item.id}">

                            Edit

                        </button>

                        <button
                            class="danger"
                            data-delete="${item.id}">

                            Delete

                        </button>

                    </div>

                `;


                container.appendChild(div);

            }
        );


        document
        .getElementById("totalJobs")
        .textContent =
            activeCount;


        container
        .querySelectorAll(
            "[data-edit]"
        )
        .forEach(button => {

            button.onclick =
                () =>
                editJob(
                    button.dataset.edit
                );

        });


        container
        .querySelectorAll(
            "[data-delete]"
        )
        .forEach(button => {

            button.onclick =
                () =>
                removeJob(
                    button.dataset.delete
                );

        });


    }catch(error){

        console.error(error);

        container.textContent =
            "Unable to load jobs.";

    }

}


/* =========================================================
   SAVE JOB
========================================================= */

window.saveJob = async function(){

    const editId =
        document
        .getElementById("editJobId")
        .value;


    const title =
        document
        .getElementById("jobTitle")
        .value
        .trim();


    if(!title){

        alert(
            "Please enter job title."
        );

        return;

    }


    const id =
        editId ||
        slugify(title);


    const data = {

        title,

        salary:
            document
            .getElementById("jobSalary")
            .value
            .trim(),

        type:
            document
            .getElementById("jobType")
            .value,

        location:
            document
            .getElementById("jobLocation")
            .value
            .trim(),

        icon:
            document
            .getElementById("jobIcon")
            .value
            .trim(),

        skillsType:
            document
            .getElementById("skillsType")
            .value,

        description:
            document
            .getElementById("jobDescription")
            .value
            .trim(),

        active:
            document
            .getElementById("jobActive")
            .checked,

        updatedAt:
            Date.now()

    };


    try{

        await setDoc(
            doc(
                db,
                "jobs",
                id
            ),
            data,
            {
                merge:true
            }
        );


        alert(
            "Job saved successfully."
        );


        clearJobForm();

        loadJobs();


    }catch(error){

        console.error(error);

        alert(
            "Job save failed: " +
            error.message
        );

    }

};


/* =========================================================
   EDIT JOB
========================================================= */

async function editJob(id){

    const snapshot =
        await getDocs(
            collection(db,"jobs")
        );


    let job = null;


    snapshot.forEach(
        item => {

            if(item.id === id){

                job = {
                    id:item.id,
                    ...item.data()
                };

            }

        }
    );


    if(!job)
        return;


    document
    .getElementById("editJobId")
    .value =
        job.id;


    document
    .getElementById("jobTitle")
    .value =
        job.title || "";


    document
    .getElementById("jobSalary")
    .value =
        job.salary || "";


    document
    .getElementById("jobType")
    .value =
        job.type || "Part Time";


    document
    .getElementById("jobLocation")
    .value =
        job.location || "Baripada";


    document
    .getElementById("jobIcon")
    .value =
        job.icon || "💼";


    document
    .getElementById("skillsType")
    .value =
        job.skillsType || "general";


    document
    .getElementById("jobDescription")
    .value =
        job.description || "";


    document
    .getElementById("jobActive")
    .checked =
        job.active !== false;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   DELETE
========================================================= */

window.removeJob = async function(id){

    if(
        !confirm(
            "Delete this job?"
        )
    )
        return;


    try{

        await deleteDoc(
            doc(
                db,
                "jobs",
                id
            )
        );


        loadJobs();


    }catch(error){

        alert(
            "Delete failed: " +
            error.message
        );

    }

};


/* =========================================================
   CLEAR
========================================================= */

window.clearJobForm = function(){

    document
    .getElementById("editJobId")
    .value = "";


    document
    .getElementById("jobTitle")
    .value = "";


    document
    .getElementById("jobSalary")
    .value = "";


    document
    .getElementById("jobLocation")
    .value = "Baripada";


    document
    .getElementById("jobIcon")
    .value = "💼";


    document
    .getElementById("jobDescription")
    .value = "";


    document
    .getElementById("jobActive")
    .checked = true;

};


/* =========================================================
   APPLICATIONS
========================================================= */

async function loadApplications(){

    const container =
        document
        .getElementById(
            "applicationsList"
        );


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "jobApplications"
                )
            );


        const applications = [];


        snapshot.forEach(
            item => {

                applications.push({

                    id:item.id,

                    ...item.data()

                });

            }
        );


        applications.sort(
            (a,b) =>
                (b.createdAt || 0) -
                (a.createdAt || 0)
        );


        document
        .getElementById(
            "totalApplications"
        )
        .textContent =
            applications.length;


        document
        .getElementById(
            "newApplications"
        )
        .textContent =
            applications.filter(
                app =>
                app.status === "New"
            ).length;


        if(
            applications.length === 0
        ){

            container.innerHTML =
                "No applications yet.";

            return;

        }


        container.innerHTML = "";


        applications.forEach(
            app => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "application";


                div.innerHTML = `

                    <h3>
                        ${escapeHTML(
                            app.name || ""
                        )}
                    </h3>

                    <p>
                        <strong>
                            Job:
                        </strong>

                        ${escapeHTML(
                            app.jobTitle || ""
                        )}
                    </p>

                    <p>
                        Mobile:
                        ${escapeHTML(
                            app.mobile || ""
                        )}
                    </p>

                    <p>
                        Course:
                        ${escapeHTML(
                            app.course || ""
                        )}
                    </p>

                    <p>

                        <span class="status ${escapeHTML(
                            app.status || "New"
                        )}">

                            ${escapeHTML(
                                app.status || "New"
                            )}

                        </span>

                    </p>


                    <div class="job-actions">

                        <button
                            class="secondary"
                            data-status="${app.id}"
                            data-value="Under Review">

                            Review

                        </button>


                        <button
                            class="secondary"
                            data-status="${app.id}"
                            data-value="Shortlisted">

                            Shortlist

                        </button>


                        <button
                            class="secondary"
                            data-status="${app.id}"
                            data-value="Selected">

                            Select

                        </button>


                        <button
                            class="danger"
                            data-status="${app.id}"
                            data-value="Rejected">

                            Reject

                        </button>

                    </div>


                    <div style="
                        margin-top:10px;
                        display:grid;
                        gap:7px;
                    ">

                        ${
                            app.cvUrl
                            ? `
                                <a
                                    href="${app.cvUrl}"
                                    target="_blank">

                                    📄 Open CV

                                </a>
                            `
                            : ""
                        }


                        ${
                            app.photoUrl
                            ? `
                                <a
                                    href="${app.photoUrl}"
                                    target="_blank">

                                    📷 Open Photo

                                </a>
                            `
                            : ""
                        }


                        ${
                            app.portfolioUrl
                            ? `
                                <a
                                    href="${app.portfolioUrl}"
                                    target="_blank">

                                    🎨 Open Portfolio

                                </a>
                            `
                            : ""
                        }

                    </div>

                `;


                container.appendChild(
                    div
                );

            }
        );


        container
        .querySelectorAll(
            "[data-status]"
        )
        .forEach(button => {

            button.onclick =
                () =>
                changeStatus(
                    button.dataset.status,
                    button.dataset.value
                );

        });


    }catch(error){

        console.error(error);

        container.textContent =
            "Unable to load applications.";

    }

}


/* =========================================================
   STATUS
========================================================= */

async function changeStatus(
    id,
    status
){

    try{

        await updateDoc(
            doc(
                db,
                "jobApplications",
                id
            ),
            {

                status,

                updatedAt:
                    Date.now()

            }
        );


        loadApplications();


    }catch(error){

        alert(
            "Status update failed: " +
            error.message
        );

    }

}


/* =========================================================
   SLUG
========================================================= */

function slugify(text){

    return text
        .toLowerCase()
        .trim()
        .replace(
            /[^a-z0-9]+/g,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            ""
        );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   START
========================================================= */

loadJobs();

loadApplications();

</script>

</body>
</html>
